<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | LRS Service</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --signal-red: #e63946;
        --signal-red-deep: #c1121f;
        --black-bg: #0a0a0a;
        --text: #f5f5f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--black-bg);
        color: var(--text);
        font-family: "Outfit", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      .wrap {
        width: min(100%, 520px);
        text-align: center;
      }

      .logo {
        display: inline-flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 20px;
        font-family: "Anton", Impact, sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .logo-main {
        font-size: 1.6rem;
      }

      .logo-sub {
        color: var(--signal-red);
        font-size: 0.9rem;
      }

      .code {
        margin: 0;
        font-family: "Anton", Impact, sans-serif;
        font-size: clamp(4.5rem, 30vw, 8rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: transparent;
        -webkit-text-stroke: 2px var(--signal-red);
        text-shadow: 0 0 16px rgba(230, 57, 70, 0.35);
      }

      h1 {
        margin: 8px 0 10px;
        font-family: "Anton", Impact, sans-serif;
        font-size: clamp(2rem, 12vw, 3rem);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      p {
        margin: 0 auto 24px;
        max-width: 38ch;
        line-height: 1.5;
      }

      .cta {
        display: grid;
        gap: 12px;
      }

      a {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        transition: transform 0.15s ease;
      }

      a:hover {
        transform: translateY(-1px);
      }

      .home {
        border: 1px solid rgba(245, 245, 245, 0.25);
        color: var(--text);
      }

      .call {
        background: var(--signal-red-deep);
        color: #fff;
      }

      .mono {
        margin-top: 16px;
        font-size: 0.78rem;
        color: rgba(245, 245, 245, 0.7);
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas,
          monospace;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="logo" aria-label="LRS Service">
        <span class="logo-main">LRS</span>
        <span class="logo-sub">Service</span>
      </div>
      <p class="code" aria-hidden="true">404</p>
      <h1>WRONG TURN.</h1>
      <p>Looks like this page doesn't exist anymore. Let's get you back on track.</p>
      <div class="cta">
        <a class="home" href="/">&larr; Back to Home</a>
        <a class="call" href="tel:9522559160">Call 952-255-9160</a>
      </div>
      <div class="mono">Cleaner Car. Better Impression.</div>
    </main>
  </body>
</html>
